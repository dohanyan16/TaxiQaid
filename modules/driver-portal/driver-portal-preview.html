<section class="view-section" id="view-driver-portal-preview">
<div class="card">
<h2>Driver Portal Preview</h2>
<p>Management Preview — Read Only</p>
<p class="preview-note">Preview authorized personal information while retaining your management identity. Driver self-service actions remain unavailable. Driver and document permissions are separate.</p>
<div class="workflow-grid">
<div class="form-group">
<label for="portal-preview-driver">Select Driver</label>
<input id="portal-preview-driver" type="search" placeholder="Search authorized drivers by Iqama or name..." autocomplete="off">
</div>
</div>
<div class="action-row">
<button id="portal-preview-open" type="button" class="btn-primary" disabled>Preview Selected Driver</button>
<button id="portal-preview-empty" type="button" class="btn-secondary" >Preview Empty Layout</button>
</div>
<p id="portal-preview-status" role="status">Driver preview integration pending. No driver records are loaded.</p>
</div>
</section>

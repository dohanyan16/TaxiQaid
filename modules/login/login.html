<!-- Login screen: authentication form and feedback. -->
<div id="login-screen">
<div class="login-box">
<img alt="TaxiQaid Logo" class="logo" src="assets/TaxiQaidLogo.jpg"/>
<form id="login-form">
<input autocapitalize="none" autocomplete="username" id="username" placeholder="Username" required="" type="text"/>
<input autocomplete="current-password" id="password" placeholder="Password" required="" type="password"/>
<button class="btn-primary" id="login-button" type="submit">Sign In</button>
<p hidden="" id="error-message" role="alert">Invalid username or password.</p>
</form>
<button id="driver-signin-entry" class="btn-secondary" type="button">Driver Sign In</button>
</div>
</div>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self'; connect-src https://mqkflwsvnzcaylxtvsje.supabase.co; img-src 'self' data:; base-uri 'none'; form-action 'none'; object-src 'none'; frame-ancestors 'none'">
  <title>Choose Password | TaxiQaid</title>
  <link rel="stylesheet" href="shared/common.css">
  <link rel="stylesheet" href="modules/login/reset-password.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0"></script>
  <script src="shared/auth-dedicated-config.js"></script>
  <script defer src="modules/login/reset-password.js"></script>
</head>
<body class="recovery-page">
  <main class="recovery-card" aria-labelledby="recovery-heading">
    <div class="recovery-brand">TaxiQaid</div>
    <h1 id="recovery-heading">Choose a new password</h1>
    <p class="recovery-description">Use the password recovery link sent to your email. Your TaxiQaid username will stay the same.</p>
    <p id="recovery-status" role="status" aria-live="polite">Checking your recovery link...</p>
    <form id="recovery-form" hidden>
      <div class="form-group"><label for="recovery-password">New password</label><input id="recovery-password" type="password" minlength="12" maxlength="256" autocomplete="new-password" required></div>
      <div class="form-group"><label for="recovery-confirm">Confirm new password</label><input id="recovery-confirm" type="password" minlength="12" maxlength="256" autocomplete="new-password" required></div>
      <p class="recovery-hint">Use at least 12 characters. Never share your password with your manager.</p>
      <button type="submit" class="btn-primary" id="recovery-submit">Save new password</button>
    </form>
    <a class="recovery-back" href="index.html">Return to TaxiQaid</a>
  </main>
</body>
</html>
